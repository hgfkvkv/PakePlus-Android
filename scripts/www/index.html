<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>保存图片测试</title>
    <style>
        body {
            background-color: #FAF7F4;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #3D322C;
            font-weight: 700;
            margin-bottom: 20px;
        }
        #preview {
            width: 300px;
            height: 300px;
            background-color: #FFFFFF;
            border: 2px solid #E8D5C4;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #9B8579;
        }
        #preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }
        .btn {
            width: 100%;
            max-width: 300px;
            height: 50px;
            background-color: #D4A574;
            color: #fff;
            border-radius: 25px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
        #log {
            margin-top: 20px;
            padding: 12px;
            background-color: #FFF8F0;
            border: 1px solid #E8D5C4;
            border-radius: 8px;
            width: 100%;
            max-width: 300px;
            font-size: 12px;
            color: #6B6B6B;
            word-break: break-all;
            min-height: 40px;
        }
    </style>
</head>
<body>
    <h1>📸 保存图片测试</h1>
    <div id="preview">等待生成...</div>
    <button class="btn" id="btnGenerate">生成并保存到相册</button>
    <div id="log">点击按钮开始测试</div>

   <script>
       document.getElementById('btnGenerate').addEventListener('click', function() {
           var btn = this;
           btn.disabled = true;
           btn.textContent = '正在保存...';
   
           // 1. 生成 Canvas 图片
           var canvas = document.createElement('canvas');
           canvas.width = 400;
           canvas.height = 400;
           var ctx = canvas.getContext('2d');
   
           ctx.fillStyle = '#FAF7F4';
           ctx.fillRect(0, 0, 400, 400);
           ctx.strokeStyle = '#D4A574';
           ctx.lineWidth = 4;
           ctx.strokeRect(2, 2, 396, 396);
           ctx.textAlign = 'center';
           ctx.textBaseline = 'middle';
           ctx.fillStyle = '#3D322C';
           ctx.font = 'bold 32px sans-serif';
           ctx.fillText('✨ 惜物', 200, 170);
           ctx.fillStyle = '#9B8579';
           ctx.font = '20px sans-serif';
           ctx.fillText('测试图片保存功能', 200, 230);
   
           // 2. 获取图片的 Base64 数据
           var base64Data = canvas.toDataURL('image/png').split(',')[1];
   
           // 3. 使用 Native.js 调用 Android 原生保存
           if (typeof plus !== 'undefined') {
               var mainActivity = plus.android.runtimeMainActivity();
               var Intent = plus.android.importClass('android.content.Intent');
               var Uri = plus.android.importClass('android.net.Uri');
               var ContentValues = plus.android.importClass('android.content.ContentValues');
               var Environment = plus.android.importClass('android.os.Environment');
   
               var values = new ContentValues();
               var fileName = 'save_test_' + Date.now() + '.png';
               var path = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES).toString() + '/' + fileName;
               
               values.put('_data', path);
               values.put('mime_type', 'image/png');
               values.put('_display_name', fileName);
   
               var uri = mainActivity.getContentResolver().insert(Uri.parse('content://media/external/images/media'), values);
   
               if (uri != null) {
                   var outputStream = mainActivity.getContentResolver().openOutputStream(uri);
                   var byteArray = androidBase64ToBytes(base64Data);
                   outputStream.write(byteArray);
                   outputStream.close();
   
                   // 发送广播通知相册更新
                   var mediaScanIntent = new Intent(Intent.ACTION_MEDIA_SCANNER_SCAN_FILE);
                   mediaScanIntent.setData(uri);
                   mainActivity.sendBroadcast(mediaScanIntent);
   
                   document.getElementById('log').textContent = '✅ 已成功保存到相册！';
                   btn.textContent = '成功！';
               } else {
                   document.getElementById('log').textContent = '❌ 保存失败，无法创建文件。';
                   btn.textContent = '重试';
               }
           }
           btn.disabled = false;
       });
   
       // 辅助函数：将 Base64 字符串转为 byte 数组
       function androidBase64ToBytes(base64) {
           var binaryString = atob(base64);
           var bytes = new Uint8Array(binaryString.length);
           for (var i = 0; i < binaryString.length; i++) {
               bytes[i] = binaryString.charCodeAt(i);
           }
           return bytes;
       }
   </script>
</body>
</html>
