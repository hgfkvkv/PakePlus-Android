<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>惜物 - 美妆保质期管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #E8D5C4;
            --secondary: #D4A574;
            --bg: #FAF7F4;
            --card-bg: #FFFFFF;
            --text-primary: #3D322C;
            --text-secondary: #9B8579;
            --fresh: #A3C4A3;
            --warning: #E8D48B;
            --critical: #E0A87C;
            --expired: #D49595;
            --empty: #C4C4C4;
            --track: #F0EDE8;
            --shadow: #3D322C;
        }

        body {
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* 页面容器 */
        .page {
            display: none;
            padding: 16px;
            min-height: 100vh;
        }

        .page.active {
            display: block;
        }

        /* 导航栏 */
        .navbar {
            position: sticky;
            top: 0;
            background-color: var(--bg);
            padding: 16px 16px 8px;
            display: flex;
            align-items: center;
            z-index: 100;
            border-bottom: 0.5px solid rgba(212, 165, 116, 0.2);
        }

        .navbar-back {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .navbar-back:hover {
            background-color: rgba(212, 165, 116, 0.1);
        }

        .navbar-title {
            font-size: 18px;
            font-weight: bold;
            flex: 1;
            text-align: center;
            margin-right: 48px;
        }

        /* 底部导航 */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            display: flex;
            padding: 8px 0;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
            box-shadow: 0 -2px 10px rgba(61, 50, 44, 0.06);
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .tab-item.active {
            color: var(--secondary);
        }

        .tab-item svg {
            width: 24px;
            height: 24px;
        }

        .tab-item span {
            font-size: 10px;
        }

        /* 物品列表卡片 */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px 16px;
            box-shadow: 0 2px 8px rgba(61, 50, 44, 0.08);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: slideIn 0.3s ease-out;
        }

        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(61, 50, 44, 0.1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-content {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-thumb {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            background-color: var(--track);
        }

        .card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-brand {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .card-dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background-color: var(--text-secondary);
        }

        .card-name {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-date {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .progress-container {
            position: relative;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background-color: var(--track);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .progress-text {
            position: absolute;
            right: 0;
            top: -16px;
            font-size: 11px;
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
        }

        .empty-illustration {
            width: 200px;
            height: 200px;
            margin-bottom: 20px;
            animation: breathe 1.5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .empty-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* FAB按钮 */
        .fab {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--secondary);
            color: white;
            border: none;
            box-shadow: 0 6px 16px rgba(212, 165, 116, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.2s;
            z-index: 90;
        }

        .fab:active {
            transform: scale(0.95);
        }

        .fab.hidden {
            transform: translateY(80px);
            opacity: 0;
        }

        /* 添加页面 */
        .add-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .photo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .photo-trigger {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .photo-trigger:active {
            transform: scale(0.95);
        }

        .photo-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--secondary);
        }

        .photo-actions {
            display: flex;
            gap: 8px;
            font-size: 13px;
            color: var(--secondary);
        }

        .photo-action {
            cursor: pointer;
            position: relative;
        }

        .photo-action:hover::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 1px;
            background-color: var(--secondary);
            animation: underline 0.2s ease-out;
        }

        @keyframes underline {
            from { width: 0; }
            to { width: 100%; }
        }

        .divider {
            color: var(--text-secondary);
        }

        .photo-hint {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 14px;
            font-weight: bold;
        }

        .form-input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: var(--card-bg);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            transition: box-shadow 0.2s, border-color 0.2s;
            border: 1px solid transparent;
        }

        .form-input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(212, 165, 116, 0.1);
        }

        .form-input::placeholder {
            color: #C4B8B0;
        }

        .date-picker {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: var(--card-bg);
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 10px;
        }

        .slider-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: var(--track);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--secondary);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .slider::-webkit-slider-thumb:active {
            transform: scale(1.1);
        }

        .expiry-hint {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 8px;
        }

        .save-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 50px;
            border-radius: 25px;
            background-color: var(--secondary);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .save-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        /* 详情页 */
        .detail-page {
            padding: 0;
        }

        .detail-header {
            position: relative;
        }

        .detail-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .detail-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(transparent, var(--bg));
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .detail-content {
            padding: 0 16px 20px;
            margin-top: -20px;
        }

        .detail-brand {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .detail-name-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .detail-name {
            font-size: 22px;
            font-weight: bold;
            flex: 1;
        }

        .status-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .status-badge.pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .status-fresh {
            background-color: rgba(163, 196, 163, 0.3);
            color: #6B8B6B;
        }

        .status-warning {
            background-color: rgba(232, 212, 139, 0.3);
            color: #8B7B3C;
        }

        .status-critical {
            background-color: rgba(224, 168, 124, 0.3);
            color: #8B5E3C;
        }

        .status-expired {
            background-color: rgba(212, 149, 149, 0.3);
            color: #8B4B4B;
        }

        .status-empty {
            background-color: rgba(196, 196, 196, 0.3);
            color: #6B6B6B;
        }

        .detail-info {
            background-color: var(--track);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .info-row svg {
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
        }

        .info-label {
            color: var(--text-secondary);
            flex: 1;
        }

        .detail-actions {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            display: flex;
            gap: 12px;
            bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .action-btn {
            flex: 1;
            height: 44px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--secondary);
            color: var(--secondary);
        }

        .btn-solid {
            background-color: var(--secondary);
            color: white;
        }

        .action-links {
            display: flex;
            gap: 20px;
            margin-top: 16px;
            justify-content: center;
        }

        .link-btn {
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .link-edit {
            color: var(--text-secondary);
            text-decoration: underline;
        }

        .link-delete {
            color: var(--expired);
        }

        /* 空瓶博物馆 */
        .bottle-header {
            background-color: rgba(232, 213, 196, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .bottle-stats {
            font-size: 14px;
            color: var(--text-primary);
        }

        .bottle-count {
            font-size: 24px;
            font-weight: bold;
            color: var(--secondary);
        }

        .bottle-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .bottle-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(61, 50, 44, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .bottle-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            filter: grayscale(100%);
            opacity: 0.85;
        }

        .bottle-name {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        .bottle-date {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
        }

        .modal-desc {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            height: 44px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: transform 0.1s;
        }

        .modal-btn:active {
            transform: scale(0.98);
        }

        .btn-cancel {
            background-color: transparent;
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
        }

        .btn-confirm {
            background-color: var(--secondary);
            color: white;
        }

        .btn-delete {
            background-color: var(--expired);
            color: white;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(232, 213, 196, 0.95);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 300;
            animation: toastIn 0.2s ease-out;
        }

        .toast.active {
            display: flex;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* 日历弹窗 */
        .calendar-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 20px;
            z-index: 200;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .calendar-modal.active {
            transform: translateY(0);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-month {
            font-size: 16px;
            font-weight: bold;
        }

        .calendar-nav {
            display: flex;
            gap: 16px;
        }

        .calendar-nav-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background-color: transparent;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .weekday {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 8px 0;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
        }

        .calendar-day.today::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--primary);
        }

        .calendar-day.selected {
            background-color: var(--secondary);
            color: white;
        }

        .calendar-day.other {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .calendar-confirm {
            margin-top: 16px;
            width: 100%;
            height: 44px;
            border-radius: 22px;
            background-color: var(--secondary);
            color: white;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        /* 闲置卡片预览 */
        .card-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .idle-card {
            width: 300px;
            height: 400px;
            background: linear-gradient(180deg, #FAF7F4 0%, rgba(232, 213, 196, 0.2) 100%);
            border-radius: 8px;
            border: 2px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        .idle-card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .idle-card-info {
            padding: 16px;
            text-align: center;
        }

        .idle-card-brand {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .idle-card-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .idle-card-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .idle-card-location {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .idle-card-footer {
            position: absolute;
            bottom: 16px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .idle-card-qr {
            width: 60px;
            height: 60px;
            background-color: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: var(--secondary);
        }

        .idle-card-watermark {
            font-size: 16px;
            color: var(--primary);
            letter-spacing: 4px;
        }

        .idle-actions {
            display: flex;
            gap: 12px;

            padding: 0 16px;

        /* 付费弹窗 */

        .pay-restore {

        /* 隐藏文件输入 */

        /* 粒子动画 */
        .particle {

            to {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }
    </style>
</head>

    <!-- Toast -->

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span id="toast-text"></span>
    </div>

    <script>
        // 音效 - 内联base64，确保离线可用
        const clickSound = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
        const successSound = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
        
        // 播放音效
        function playSound(sound) {
            sound.currentTime = 0;
            sound.volume = 0.3;
            sound.play().catch(() => {});
        }

        // 全局状态
        let currentPage = 'home';
        let items = [];
        let currentItem = null;
        let isPaid = false;
        let selectedDate = new Date();
        let calendarDate = new Date();
        let pageHistory = [];

        // 初始化
        async function init() {
            // 请求通知权限
            if ('Notification' in window) {
                Notification.requestPermission();
            }

            // 加载数据
            await loadData();
            renderItems();
            renderBottles();
            updateSliderValue();

            // 滚动监听FAB
            window.addEventListener('scroll', handleScroll);

            // 初始化日期
            updateDateDisplay();
        }

        // IndexedDB 封装
        let db;
        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('XiwuDB', 1);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains('items')) {
                        db.createObjectStore('items', { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains('settings')) {
                        db.createObjectStore('settings', { keyPath: 'key' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = reject;
            });
        }

        async function loadData() {
            await openDB();
            // 加载物品
            const itemStore = db.transaction('items', 'readonly').objectStore('items');
            items = await new Promise((resolve) => {
                const request = itemStore.getAll();
                request.onsuccess = () => resolve(request.result || []);
            });

            // 加载设置
            const settingStore = db.transaction('settings', 'readonly').objectStore('settings');
            const paid = await new Promise((resolve) => {
                const request = settingStore.get('isPaid');
                request.onsuccess = () => resolve(request.result?.value || false);
            });
            isPaid = paid;

            // 检查通知
            checkNotifications();
        }

        async function saveItemToDB(item) {
            const tx = db.transaction('items', 'readwrite');
            tx.objectStore('items').put(item);
            return new Promise((resolve) => {
                tx.oncomplete = resolve;
            });
        }

        async function deleteItemFromDB(id) {
            const tx = db.transaction('items', 'readwrite');
            tx.objectStore('items').delete(id);
            return new Promise((resolve) => {
                tx.oncomplete = resolve;
            });
        }

        async function saveSetting(key, value) {
            const tx = db.transaction('settings', 'readwrite');
            tx.objectStore('settings').put({ key, value });
            return new Promise((resolve) => {
                tx.oncomplete = resolve;
            });
        }

        // 页面切换
        function switchTab(tab) {
            playSound(clickSound);
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab-item[onclick="switchTab('${tab}')"]`).classList.add('active');
            
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`${tab}-page`).classList.add('active');
            
            if (tab === 'home') {
                document.getElementById('fab-btn').style.display = 'flex';
            } else {
                document.getElementById('fab-btn').style.display = 'none';
            }
            
            currentPage = tab;
            pageHistory = [];
        }

        function goToPage(page) {
            pageHistory.push(currentPage);
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`${page}-page`).classList.add('active');
            
            if (page === 'add') {
                document.getElementById('fab-btn').style.display = 'none';
                resetAddForm();
            } else {
                document.getElementById('fab-btn').style.display = 'none';
            }
            
            currentPage = page;
        }

        function goBack() {
            playSound(clickSound);
            if (pageHistory.length > 0) {
                const prevPage = pageHistory.pop();
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(`${prevPage}-page`).classList.add('active');
                currentPage = prevPage;
                
                if (prevPage === 'home') {
                    document.getElementById('fab-btn').style.display = 'flex';
                }
            } else {
                switchTab('home');
            }
        }

        function goToAdd() {
            playSound(clickSound);
            // 检查是否超过免费限制
            const activeItems = items.filter(i => i.status !== 'empty').length;
            if (!isPaid && activeItems >= 5) {
                showPayModal();
                return;
            }
            document.getElementById('add-page-title').textContent = '添加物品';
            goToPage('add');
        }

        // 滚动处理FAB
        let lastScroll = 0;
        let scrollTimer = null;
        function handleScroll() {
            const currentScroll = window.scrollY;
            const fab = document.getElementById('fab-btn');
            
            if (currentScroll > lastScroll && currentScroll > 50) {
                fab.classList.add('hidden');
            } else {
                fab.classList.remove('hidden');
            }
            
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
                fab.classList.remove('hidden');
            }, 300);
            
            lastScroll = currentScroll;
        }

        // 渲染物品列表
        function renderItems() {
            const list = document.getElementById('item-list');
            const empty = document.getElementById('home-empty');
            
            // 过滤非空瓶的，按到期日排序
            const activeItems = items.filter(i => i.status !== 'empty').sort((a, b) => {
                return new Date(a.expiryDate) - new Date(b.expiryDate);
            });
            
            if (activeItems.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'flex';
                return;
            }
            
            empty.style.display = 'none';
            list.innerHTML = activeItems.map(item => {
                const status = getStatus(item);
                const progress = getProgress(item);
                const statusColor = getStatusColor(status);
                const remainingDays = item.remainingDays;
                
                return `
                    <div class="item-card" onclick="viewItem('${item.id}')">
                        <div class="card-content">
                            <img class="card-thumb" src="${item.imagePath}" alt="${item.name}"/>
                            <div class="card-info">
                                <div class="card-title">
                                    <span class="card-brand">${item.brand}</span>
                                    <span class="card-dot"></span>
                                    <span class="card-name">${item.name}</span>
                                </div>
                                <div class="card-date">
                                    ${formatDate(item.openDate)}
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M9 18l6-6-6-6"/>
                                    </svg>
                                    ${formatDate(item.expiryDate)}
                                </div>
                            </div>
                        </div>
                        <div class="progress-container">
                            <span class="progress-text" style="color: ${statusColor}">${remainingDays <= 0 ? '已过期' : `剩余 ${remainingDays} 天`}</span>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%; background-color: ${statusColor}"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 渲染空瓶
        function renderBottles() {
            const grid = document.getElementById('bottle-grid');
            const empty = document.getElementById('bottle-empty');
            const countEl = document.getElementById('bottle-count');
            
            const emptyItems = items.filter(i => i.status === 'empty');
            countEl.textContent = emptyItems.length;
            
            if (emptyItems.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'flex';
                return;
            }
            
            empty.style.display = 'none';
            grid.innerHTML = emptyItems.map(item => `
                <div class="bottle-card" onclick="viewItem('${item.id}')">
                    <img class="bottle-thumb" src="${item.imagePath}" alt="${item.name}"/>
                    <div class="bottle-name">${item.name}</div>
                    <div class="bottle-date">${formatDate(item.openDate)} - ${formatDate(item.expiryDate)}</div>
                </div>
            `).join('');
        }

        // 计算状态
        function getStatus(item) {
            if (item.status === 'empty') return 'empty';
            const remainingDays = item.remainingDays;
            const totalDays = item.expiryMonths * 30 + item.expiryDays;
            
            if (remainingDays <= 0) return 'expired';
            if (remainingDays <= totalDays / 5) return 'critical';
            if (remainingDays <= totalDays / 2) return 'warning';
            return 'fresh';
        }

        function getStatusColor(status) {
            const colors = {
                fresh: '#A3C4A3',
                warning: '#E8D48B',
                critical: '#E0A87C',
                expired: '#D49595',
                empty: '#C4C4C4'
            };
            return colors[status] || colors.fresh;
        }

        function getStatusClass(status) {
            const classes = {
                fresh: 'status-fresh',
                warning: 'status-warning',
                critical: 'status-critical',
                expired: 'status-expired',
                empty: 'status-empty'
            };
            return classes[status] || classes.fresh;
        }

        function getStatusText(status) {
            const texts = {
                fresh: '新鲜',
                warning: '注意',
                critical: '临期',
                expired: '过期',
                empty: '空瓶'
            };
            return texts[status] || texts.fresh;
        }

        function getProgress(item) {
            const totalDays = item.expiryMonths * 30 + item.expiryDays;
            const usedDays = totalDays - item.remainingDays;
            return Math.min(100, Math.max(0, (usedDays / totalDays) * 100));
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}.${month}.${day}`;
        }

        // 照片处理
        function handlePhotoSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            playSound(clickSound);
            
            const reader = new FileReader();
            reader.onload = (e) => {
                // 压缩图片
                compressImage(e.target.result, (compressed) => {
                    document.getElementById('photo-preview').src = compressed;
                    document.getElementById('photo-preview').style.display = 'block';
                    document.getElementById('camera-icon').style.display = 'none';
                    document.getElementById('photo-actions').style.display = 'flex';
                    document.getElementById('photo-hint').style.display = 'none';
                    validateForm();
                });
            };
            reader.readAsDataURL(file);
        }

        function compressImage(src, callback) {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                
                // 最大尺寸限制
                const maxSize = 800;
                if (width > maxSize || height > maxSize) {
                    if (width > height) {
                        height = height * (maxSize / width);
                        width = maxSize;
                    } else {
                        width = width * (maxSize / height);
                        height = maxSize;
                    }
                }
                
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.src = src;
        }

        // 滑块更新
        function updateSliderValue() {
            const monthSlider = document.getElementById('month-slider');
            const daySlider = document.getElementById('day-slider');
            
            const months = parseInt(monthSlider.value);
            const days = parseInt(daySlider.value);
            
            document.getElementById('month-value').textContent = `${months} 个月`;
            document.getElementById('day-value').textContent = `${days} 天`;
            
            // 计算预计到期日
            const openDate = new Date(selectedDate);
            openDate.setMonth(openDate.getMonth() + months);
            openDate.setDate(openDate.getDate() + days);
            
            document.getElementById('expiry-hint').textContent = `预计到期日：${formatDate(openDate)}`;
        }

        // 日期选择
        function updateDateDisplay() {
            const year = selectedDate.getFullYear();
            const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
            const day = String(selectedDate.getDate()).padStart(2, '0');
            document.getElementById('date-display').textContent = `${year} 年 ${month} 月 ${day} 日`;
            updateSliderValue();
        }

        function openCalendar() {
            playSound(clickSound);
            calendarDate = new Date(selectedDate);
            renderCalendar();
            document.getElementById('calendar-modal').classList.add('active');
        }

        function closeCalendar() {
            document.getElementById('calendar-modal').classList.remove('active');
            updateDateDisplay();
        }

        function prevMonth() {
            calendarDate.setMonth(calendarDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            calendarDate.setMonth(calendarDate.getMonth() + 1);
            renderCalendar();
        }

        function renderCalendar() {
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            
            document.getElementById('calendar-month').textContent = `${year}年${month + 1}月`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();
            const daysInMonth = lastDay.getDate();
            
            const today = new Date();
            const container = document.getElementById('calendar-days');
            container.innerHTML = '';
            
            // 上个月的天
            for (let i = startDay; i > 0; i--) {
                const day = new Date(year, month, -i + 1);
                const div = document.createElement('div');
                div.className = 'calendar-day other';
                div.textContent = day.getDate();
                container.appendChild(div);
            }
            
            // 当月的天
            for (let i = 1; i <= daysInMonth; i++) {
                const div = document.createElement('div');
                div.className = 'calendar-day';
                div.textContent = i;
                
                const current = new Date(year, month, i);
                if (current.toDateString() === selectedDate.toDateString()) {
                    div.classList.add('selected');
                }
                if (current.toDateString() === today.toDateString()) {
                    div.classList.add('today');
                }
                
                div.onclick = () => {
                    selectedDate = new Date(year, month, i);
                    renderCalendar();
                };
                
                container.appendChild(div);
            }
            
            // 下个月的天
            const remaining = 42 - (startDay + daysInMonth);
            for (let i = 1; i <= remaining; i++) {
                const div = document.createElement('div');
                div.className = 'calendar-day other';
                div.textContent = i;
                container.appendChild(div);
            }
        }

        // 表单验证
        function validateForm() {
            const brand = document.getElementById('brand-input').value.trim();
            const name = document.getElementById('name-input').value.trim();
            const photo = document.getElementById('photo-preview').src;
            
            const valid = brand && name && photo;
            document.getElementById('save-btn').disabled = !valid;
        }

        // 重置添加表单
        function resetAddForm() {
            document.getElementById('brand-input').value = '';
            document.getElementById('name-input').value = '';
            document.getElementById('photo-preview').style.display = 'none';
            document.getElementById('camera-icon').style.display = 'block';
            document.getElementById('photo-actions').style.display = 'none';
            document.getElementById('photo-hint').style.display = 'block';
            document.getElementById('month-slider').value = 12;
            document.getElementById('day-slider').value = 0;
            selectedDate = new Date();
            calendarDate = new Date();
            updateDateDisplay();
            updateSliderValue();
            validateForm();
        }

        // 保存物品
        async function saveItem() {
            playSound(successSound);
            
            const brand = document.getElementById('brand-input').value.trim();
            const name = document.getElementById('name-input').value.trim();
            const imagePath = document.getElementById('photo-preview').src;
            const months = parseInt(document.getElementById('month-slider').value);
            const days = parseInt(document.getElementById('day-slider').value);
            const openDate = new Date(selectedDate);
            
            // 计算到期日
            const expiryDate = new Date(openDate);
            expiryDate.setMonth(expiryDate.getMonth() + months);
            expiryDate.setDate(expiryDate.getDate() + days);
            
            // 计算剩余天数
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const remainingDays = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));
            
            const item = {
                id: currentItem ? currentItem.id : generateUUID(),
                brand,
                name,
                imagePath,
                openDate: openDate.toISOString(),
                expiryMonths: months,
                expiryDays: days,
                expiryDate: expiryDate.toISOString(),
                remainingDays,
                status: currentItem ? currentItem.status : getStatus({ remainingDays, expiryMonths: months, expiryDays: days, status: 'active' }),
                createdAt: currentItem ? currentItem.createdAt : new Date().toISOString()
            };
            
            await saveItemToDB(item);
            
            // 更新列表
            if (currentItem) {
                const index = items.findIndex(i => i.id === item.id);
                if (index >= 0) items[index] = item;
            } else {
                items.push(item);
            }
            
            // 注册通知
            registerNotifications(item);
            
            showToast('已添加，到期前会提醒你哦～');
            currentItem = null;
            
            goBack();
            renderItems();
            renderBottles();
        }

        // 查看物品详情
        function viewItem(id) {
            playSound(clickSound);
            currentItem = items.find(i => i.id === id);
            if (!currentItem) return;
            
            // 填充详情
            document.getElementById('detail-image').src = currentItem.imagePath;
            document.getElementById('detail-brand').textContent = currentItem.brand;
            document.getElementById('detail-name').textContent = currentItem.name;
            
            const status = getStatus(currentItem);
            const statusClass = getStatusClass(status);
            const statusText = getStatusText(status);
            const statusEl = document.getElementById('detail-status');
            statusEl.className = `status-badge ${statusClass}`;
            if (status === 'critical' || status === 'expired') {
                statusEl.classList.add('pulse');
            } else {
                statusEl.classList.remove('pulse');
            }
            statusEl.textContent = statusText;
            
            // 信息行
            const remainingDays = currentItem.remainingDays;
            const statusColor = getStatusColor(status);
            document.getElementById('detail-info').innerHTML = `
                <div class="info-row">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span class="info-label">开封日期</span>
                    <span>${formatDate(currentItem.openDate)}</span>
                </div>
                <div class="info-row">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
                    </svg>
                    <span class="info-label">保质期</span>
                    <span>${currentItem.expiryMonths} 个月 ${currentItem.expiryDays} 天</span>
                </div>
                <div class="info-row">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
                    </svg>
                    <span class="info-label">到期日期</span>
                    <span>${formatDate(currentItem.expiryDate)}</span>
                </div>
                <div class="info-row">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
                    </svg>
                    <span class="info-label">剩余天数</span>
                    <span style="color: ${statusColor}">${remainingDays <= 0 ? '已过期' : `${remainingDays} 天`}</span>
                </div>
            `;
            
            // 空瓶按钮状态
            if (currentItem.status === 'empty') {
                document.getElementById('empty-btn').style.display = 'none';
            } else {
                document.getElementById('empty-btn').style.display = 'flex';
            }
            
            goToPage('detail');
        }

        // 编辑物品
        function editItem() {
            playSound(clickSound);
            document.getElementById('add-page-title').textContent = '编辑物品';
            
            // 填充表单
            document.getElementById('brand-input').value = currentItem.brand;
            document.getElementById('name-input').value = currentItem.name;
            document.getElementById('photo-preview').src = currentItem.imagePath;
            document.getElementById('photo-preview').style.display = 'block';
            document.getElementById('camera-icon').style.display = 'none';
            document.getElementById('photo-actions').style.display = 'flex';
            document.getElementById('photo-hint').style.display = 'none';
            
            document.getElementById('month-slider').value = currentItem.expiryMonths;
            document.getElementById('day-slider').value = currentItem.expiryDays;
            selectedDate = new Date(currentItem.openDate);
            updateDateDisplay();
            updateSliderValue();
            validateForm();
            
            goToPage('add');
        }

        // 标记空瓶
        function markAsEmpty() {
            playSound(successSound);
            
            // 粒子动画
            createParticles();
            
            currentItem.status = 'empty';
            saveItemToDB(currentItem);
            
            const index = items.findIndex(i => i.id === currentItem.id);
            if (index >= 0) items[index] = currentItem;
            
            showToast('太棒了！又完成一件空瓶～');
            
            goBack();
            renderItems();
            renderBottles();
        }

        // 粒子动画
        function createParticles() {
            const btn = document.getElementById('empty-btn');
            const rect = btn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const colors = ['#A3C4A3', '#E8D48B', '#D4A574', '#E8D5C4'];
            
            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                particle.style.width = '8px';
                particle.style.height = '8px';
                particle.style.borderRadius = '50%';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const tx = (Math.random() - 0.5) * 160;
                const ty = (Math.random() - 0.5) * 160;
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.animation = 'particleFly 0.6s ease-out forwards';
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        }

        // 删除物品
        function deleteItem() {
            playSound(clickSound);
            showConfirm('确认删除', '删除后无法恢复，确定要删除这件物品吗？', () => {
                playSound(clickSound);
                deleteItemFromDB(currentItem.id);
                items = items.filter(i => i.id !== currentItem.id);
                
                showToast('已删除');
                goBack();
                renderItems();
                renderBottles();
            });
        }

        // 闲置卡片
        function goToIdleCard() {
            playSound(clickSound);
            
            // 填充卡片
            document.getElementById('idle-card-image').src = currentItem.imagePath;
            document.getElementById('idle-card-brand').textContent = currentItem.brand;
            document.getElementById('idle-card-name').textContent = currentItem.name;
            document.getElementById('idle-card-meta').textContent = `${formatDate(currentItem.openDate)} 开封 · 用了一半`;
            
            goToPage('idle');
        }

        function updateRemainValue() {
            const values = ['全新', '用了 1/3', '用了一半', '用了 2/3', '快用完了'];
            const value = values[document.getElementById('remain-slider').value];
            document.getElementById('remain-value').textContent = value;
            updateIdleCard();
        }

        function updateIdleCard() {
            const location = document.getElementById('location-input').value || '北京朝阳';
            document.getElementById('idle-location').textContent = location;
            
            const values = ['全新', '用了 1/3', '用了一半', '用了 2/3', '快用完了'];
            const remain = values[document.getElementById('remain-slider').value];
            document.getElementById('idle-card-meta').textContent = `${formatDate(currentItem.openDate)} 开封 · ${remain}`;
        }

        function saveCardToAlbum() {
            playSound(successSound);
            // 生成Canvas图片
            const card = document.getElementById('idle-card');
            html2canvas(card).then(canvas => {
                const link = document.createElement('a');
                link.download = `惜物闲置_${currentItem.name}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
                showToast('已保存到相册 📸');
            });
        }

        function shareCard() {
            playSound(clickSound);
            if (navigator.share) {
                const text = '我在惜物 App 上发布了一件闲置，来看看有没有你需要的～';
                navigator.share({ text });
            } else {
                showToast('已复制分享文案');
                navigator.clipboard.writeText('我在惜物 App 上发布了一件闲置，来看看有没有你需要的～');
            }
        }

        // 通知处理
        function registerNotifications(item) {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            
            const expiryDate = new Date(item.expiryDate);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            // 注册四个时间点的通知
            const times = [
                { days: 30, title: '⏰ 你的 ' + item.name + ' 还有 30 天过期，趁新鲜快用～' },
                { days: 7, title: '⚠️ ' + item.name + ' 只剩 7 天就过期了，要抓紧哦！' },
                { days: 3, title: '🔴 紧急！' + item.name + ' 3 天后过期，今天就用它！' },
                { days: 0, title: '📢 ' + item.name + ' 今天到期了，检查一下还能不能用吧' }
            ];
            
            times.forEach(t => {
                const notifyDate = new Date(expiryDate);
                notifyDate.setDate(notifyDate.getDate() - t.days);
                notifyDate.setHours(9, 0, 0, 0);
                
                const diff = notifyDate - today;
                if (diff > 0) {
                    setTimeout(() => {
                        new Notification('惜物 - 保质期提醒', {
                            body: t.title,
                            icon: '/favicon.ico'
                        });
                    }, diff);
                }
            });
        }

        function checkNotifications() {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const notifications = [];
            items.forEach(item => {
                if (item.status === 'empty') return;
                
                const remainingDays = item.remainingDays;
                if (remainingDays === 30) {
                    notifications.push('⏰ ' + item.name + ' 还有 30 天过期');
                } else if (remainingDays === 7) {
                    notifications.push('⚠️ ' + item.name + ' 只剩 7 天过期');
                } else if (remainingDays === 3) {
                    notifications.push('🔴 ' + item.name + ' 只剩 3 天过期');
                } else if (remainingDays === 0) {
                    notifications.push('📢 ' + item.name + ' 今天到期了');
                }
            });
            
            if (notifications.length > 0) {
                if (notifications.length === 1) {
                    new Notification('惜物 - 保质期提醒', { body: notifications[0] });
                } else {
                    new Notification('惜物 - 保质期提醒', { 
                        body: `你有 ${notifications.length} 件物品需要注意保质期`
                    });
                }
            }
        }

        // 弹窗
        function showModal(title, desc, actions) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            
            const actionsEl = document.getElementById('modal-actions');
            actionsEl.innerHTML = '';
            actions.forEach(action => {
                const btn = document.createElement('button');
                btn.className = `modal-btn ${action.class || 'btn-confirm'}`;
                btn.textContent = action.text;
                btn.onclick = () => {
                    action.onClick?.();
                    closeModal();
                };
                actionsEl.appendChild(btn);
            });
            
            document.getElementById('modal-overlay').classList.add('active');
            document.getElementById('modal-content').style.display = 'block';
        }

        function showConfirm(title, desc, onConfirm) {
            showModal(title, desc, [
                { text: '取消', class: 'btn-cancel' },
                { text: '确定', class: 'btn-confirm', onClick: onConfirm }
            ]);
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            document.getElementById('modal-content').style.display = 'none';
        }

        // 付费弹窗
        function showPayModal() {
            const content = `
                <svg class="modal-illustration" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="20" y="40" width="80" height="60" rx="8" fill="#E8D5C4" stroke="#D4A574" stroke-width="2"/>
                    <path d="M60 20L80 40H40L60 20Z" fill="#D4A574" stroke="#D4A574" stroke-width="2"/>
                    <circle cx="50" cy="65" r="4" fill="#A3C4A3"/>
                    <circle cx="60" cy="70" r="5" fill="#E8D48B"/>
                    <circle cx="72" cy="62" r="4" fill="#E0A87C"/>
                </svg>
                <div class="modal-title">解锁无限添加</div>
                <div class="modal-desc">18 元永久买断，想加多少加多少，让每一件心爱之物都有处安放。</div>
                <div class="pay-price">
                    <span class="pay-price-value">¥18</span>
                    <span class="pay-price-tag">永久</span>
                </div>
                <button class="modal-btn btn-confirm" onclick="unlockPay()">立即解锁</button>
                <div class="pay-restore" onclick="restorePay()">恢复购买</div>
            `;
            
            document.getElementById('modal-content').innerHTML = content;
            document.getElementById('modal-overlay').classList.add('active');
            document.getElementById('modal-content').style.display = 'block';
        }

        async function unlockPay() {
            isPaid = true;
            await saveSetting('isPaid', true);
            closeModal();
            showToast('已解锁无限添加！');
            goToAdd();
        }

        async function restorePay() {
            if (isPaid) {
                showToast('你已经是付费用户啦');
            } else {
                showToast('未找到购买记录');
            }
        }

        // Toast
        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = text;
            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 2500);
        }

        // UUID生成
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // 加载html2canvas用于卡片生成
        function loadHtml2Canvas() {
            const script = document.createElement('script');
            script.src = 'https://html2canvas.hertzen.com/dist/html2canvas.min.js';
            document.body.appendChild(script);
        }

        // 初始化
        window.onload = function() {
            init();
            loadHtml2Canvas();
        };
    </script>
